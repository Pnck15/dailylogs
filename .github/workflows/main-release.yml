name: Build and release DailyLog

on:
  push:
    branches: [feature/dailylog-notify]
    paths:
      - main.py
      - dailylog_finance.py
      - dailylog_forms.py
      - tests/windows_main_features_smoke.py
      - cloud_db.py
      - cloud_worker.py
      - sale_api_monitor.py
      - sheet_monitor.py
      - notify_channels.py
      - update_checker.py
      - updater.py
      - main.spec
      - updater.spec
      - build_release.ps1
      - publish_release.ps1
      - notify_build_config.json
      - requirements-main-build.txt
      - tests/windows_main_update_smoke.py
      - tests/verify_main_release.py
      - .github/workflows/main-release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dailylog-main-release
  cancel-in-progress: true

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Python sources
        run: >
          python -m py_compile
          main.py dailylog_finance.py dailylog_forms.py cloud_db.py cloud_worker.py sale_api_monitor.py
          sheet_monitor.py notify_channels.py update_checker.py updater.py

      - name: Validate PowerShell build and publishing scripts
        shell: pwsh
        run: |
          foreach ($file in @("build_release.ps1", "publish_release.ps1")) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }

      - name: Build DailyLog and updater
        shell: pwsh
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { throw "Could not create Python 3.12 build environment." }
          ./build_release.ps1 -GitHubRepo $env:GITHUB_REPOSITORY

      - name: Smoke test the Windows binaries
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $app = Start-Process ./release/DailyLog.exe -ArgumentList "--smoke-test" -PassThru
          if (-not $app.WaitForExit(120000)) { $app.Kill(); throw "DailyLog binary smoke test timed out." }
          if ($app.ExitCode -ne 0) { throw "DailyLog binary smoke test failed: $($app.ExitCode)" }
          ./.venv/Scripts/python.exe tests/windows_main_update_smoke.py
          if ($LASTEXITCODE -ne 0) { throw "Compiled updater smoke test failed." }
          ./.venv/Scripts/python.exe tests/windows_main_features_smoke.py
          if ($LASTEXITCODE -ne 0) { throw "Main 3% calculator / red-plate form smoke test failed." }

      - uses: actions/upload-artifact@v4
        with:
          name: DailyLog-Windows-${{ github.sha }}
          path: release/*.exe
          if-no-files-found: error

      - name: Publish the versioned DailyLog release
        shell: pwsh
        run: |
          $source = Get-Content main.py -Raw
          $version = [regex]::Match($source, 'APP_VERSION\s*=\s*"([^"]+)"').Groups[1].Value
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; verifying the published assets."
            exit 0
          }
          ./publish_release.ps1 -GitHubRepo $env:GITHUB_REPOSITORY

      - name: Verify public release discovery and asset hashes
        run: ./.venv/Scripts/python.exe tests/verify_main_release.py
