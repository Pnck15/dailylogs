name: SA Sathorn regression checks

on:
  push:
    branches: [feature/dailylog-notify]
    paths:
      - main.py
      - sale_api_monitor.py
      - gas/sa_sathorn_v6.gs
      - supabase/functions/dailylog-monitor-worker/index.ts
      - tests/test_sa_monitor.py
      - tests/test_sa_gas_v6.cjs
      - .github/workflows/sa-regression.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sa-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: SA status and inherited-date tests (offline)
        run: python -m unittest discover -s tests -p 'test_sa_monitor.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: GAS two-month and merged-D contract (offline)
        run: node tests/test_sa_gas_v6.cjs
      - name: Compile Central monitor worker TypeScript
        run: |
          npm install --no-save --no-package-lock esbuild@0.24.2
          ./node_modules/.bin/esbuild supabase/functions/dailylog-monitor-worker/index.ts --bundle --platform=neutral --external:jsr:* --outfile=/tmp/sa-monitor-worker-check.js
