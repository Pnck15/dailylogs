name: Python syntax check

on:
  push:
    branches:
      - feature/dailylog-notify
  pull_request:

jobs:
  py-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: |
          python -m py_compile             main.py             dailylog_notify.py             notify_receiver.py             cloud_db.py             cloud_worker.py             sale_api_monitor.py             sheet_monitor.py             updater.py             update_checker.py
